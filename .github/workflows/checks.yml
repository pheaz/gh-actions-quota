name: Checks

on:
  workflow_call:
    inputs:
      candidate_artifact:
        description: Optional Git bundle artifact for release validation
        type: string
        default: ""
      candidate_sha:
        type: string
        default: ""
      candidate_tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  action:
    runs-on: ${{ vars.LINUX_SERVER }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_artifact != '' }}
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release-candidate
      - name: Restore release candidate
        if: ${{ inputs.candidate_artifact != '' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/release.mjs restore "$RUNNER_TEMP/release-candidate/candidate.bundle" "$CANDIDATE_SHA"
      - run: node --check action/launcher.js
      - run: node --test action/launcher.test.js
      - run: node --test scripts/release.test.mjs

  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ${{ vars.LINUX_SERVER }}
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_artifact != '' }}
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release-candidate
      - name: Restore release candidate
        if: ${{ inputs.candidate_artifact != '' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/release.mjs restore "$RUNNER_TEMP/release-candidate/candidate.bundle" "$CANDIDATE_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/gh-actions-quota
      - name: Smoke-test the Go Action command independently of published releases
        shell: bash
        run: |
          binary=./gh-actions-quota
          if [[ "$RUNNER_OS" == Windows ]]; then binary=./gh-actions-quota.exe; fi
          GITHUB_REPOSITORY_VISIBILITY=public GITHUB_OUTPUT="$RUNNER_TEMP/quota-output" GITHUB_STEP_SUMMARY="$RUNNER_TEMP/quota-summary" "$binary" action
          grep -qx 'allowed=true' "$RUNNER_TEMP/quota-output"
          grep -qx 'unmetered=true' "$RUNNER_TEMP/quota-output"
          grep -q 'unmetered' "$RUNNER_TEMP/quota-summary"
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

  binaries:
    runs-on: ${{ vars.LINUX_SERVER }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_artifact != '' }}
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release-candidate
      - name: Restore release candidate
        if: ${{ inputs.candidate_artifact != '' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/release.mjs restore "$RUNNER_TEMP/release-candidate/candidate.bundle" "$CANDIDATE_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build platform executables
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          tag="${CANDIDATE_TAG:-v$(node -p 'require("./package.json").version')}"
          test "$tag" = "v$(node -p 'require("./package.json").version')"
          bash scripts/build-release.sh "$tag"
          test "$(release/gh-actions-quota_${tag}_linux-amd64 --version)" = "gh actions-quota $tag"
      - name: Verify all platform checksums
        run: |
          node scripts/release.mjs verify-assets "v$(node -p 'require("./package.json").version')" release
          cd release && sha256sum --check checksums.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.candidate_artifact != '' }}
        with:
          name: release-assets
          path: |
            release/gh-actions-quota_${{ inputs.candidate_tag }}_darwin-arm64
            release/gh-actions-quota_${{ inputs.candidate_tag }}_darwin-amd64
            release/gh-actions-quota_${{ inputs.candidate_tag }}_linux-amd64
            release/gh-actions-quota_${{ inputs.candidate_tag }}_linux-arm64
            release/gh-actions-quota_${{ inputs.candidate_tag }}_windows-amd64.exe
            release/checksums.txt
          if-no-files-found: error
          retention-days: 7
