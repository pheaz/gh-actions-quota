name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify committed action bundle
        run: |
          git ls-files --error-unmatch dist/index.js
          git diff --exit-code -- dist/
          node --check dist/index.js
      - name: Smoke-test the bundled public-repository action
        run: |
          GITHUB_REPOSITORY_VISIBILITY=public GITHUB_OUTPUT="$RUNNER_TEMP/quota-output" node dist/index.js
          grep -qx 'allowed=true' "$RUNNER_TEMP/quota-output"
          grep -qx 'unmetered=true' "$RUNNER_TEMP/quota-output"
      - name: Run through action.yml in the public repository
        if: ${{ github.event.repository.private == false }}
        id: quota
        uses: ./
      - name: Verify action outputs
        if: ${{ github.event.repository.private == false }}
        env:
          ALLOWED: ${{ steps.quota.outputs.allowed }}
          UNMETERED: ${{ steps.quota.outputs.unmetered }}
        run: |
          test "$ALLOWED" = true
          test "$UNMETERED" = true

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/gh-actions-quota
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/build-release.sh v1.0.0
      - name: Verify all platform checksums
        run: cd release && sha256sum --check checksums.txt
