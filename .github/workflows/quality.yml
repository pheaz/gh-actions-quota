name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

      - name: Smoke-test the action in its public repository
        id: quota
        uses: ./
        with:
          threshold: 50

      - name: Verify public-repository result
        env:
          ALLOWED: ${{ steps.quota.outputs.allowed }}
          UNMETERED: ${{ steps.quota.outputs.unmetered }}
        run: |
          test "$ALLOWED" = "true"
          test "$UNMETERED" = "true"
