name: Quality

on:
  push:
  pull_request:

jobs:
  quota:
    name: Actions quota
    runs-on: ubuntu-latest
    outputs:
      usage_available: ${{ steps.quota.outputs.usage_available }}
      usage_percent: ${{ steps.quota.outputs.usage_percent }}
    steps:
      - uses: actions/checkout@v4
      - name: Measure Actions quota
        id: quota
        env:
          PYTHONPATH: src
          ACTIONS_QUOTA_TOKEN: ${{ secrets.ACTIONS_QUOTA_TOKEN }}
          ACTIONS_QUOTA_MINUTES: ${{ vars.ACTIONS_QUOTA_MINUTES || '2000' }}
        run: python3 -m github_actions_quota

  format:
    name: Format
    needs: quota
    if: needs.quota.outputs.usage_available == 'true' && needs.quota.outputs.usage_percent < 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .

  lint:
    name: Lint
    needs: quota
    if: needs.quota.outputs.usage_available == 'true' && needs.quota.outputs.usage_percent < 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .

  typecheck:
    name: Type Check
    needs: quota
    if: needs.quota.outputs.usage_available == 'true' && needs.quota.outputs.usage_percent < 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run basedpyright

  tests:
    name: Tests
    needs: quota
    if: needs.quota.outputs.usage_available == 'true' && needs.quota.outputs.usage_percent < 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest

  lock:
    name: Lock
    needs: quota
    if: needs.quota.outputs.usage_available == 'true' && needs.quota.outputs.usage_percent < 100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.7.0
      - run: uv lock --check
