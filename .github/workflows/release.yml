name: Release action and extension

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-v1
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate shared version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native extension assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* "${args[@]}"
          fi
      - name: Advance stable major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Do not let a late retry of an older release move v1 backwards.
          latest="$(git tag --list 'v1.*.*' | sed '/-/d' | sort -V | tail -1)"
          if [[ "$latest" != "$RELEASE_TAG" ]]; then exit 0; fi
          git tag --force v1 "${RELEASE_TAG}^{commit}"
          git push --force origin refs/tags/v1
