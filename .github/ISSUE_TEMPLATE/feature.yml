name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - GitHub CLI extension
        - GitHub Action
        - Setup workflow generation
        - Status command
        - Release/install process
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternative approaches or workarounds.
