[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-quota"
version = "0.1.0"
description = "Measure GitHub Actions quota usage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
github-actions-quota = "github_actions_quota.__main__:main"

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
    "EM",
    "FBT",
    "FURB157",
    "INP001",
    "PLR0913",
    "T201",
    "TC001",
    "TRY003",
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "S101"]

[tool.basedpyright]
typeCheckingMode = "strict"
